name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run db:local
      - run: npx wrangler deploy --dry-run --outdir .generated/worker
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AGENT_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - run: python -m pytest
      - run: node --check static/app.js
      - run: node --check static/settings.js
      - run: node --check static/calendar.js
  services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: daywork
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: daywork_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U daywork -d daywork_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports: ['6333:6333']
    env:
      RUN_SERVICE_TESTS: '1'
      AGENT_MODE: demo
      DATABASE_URL: postgresql+psycopg://daywork:ci_only@localhost:5432/daywork_test
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - run: python -m pytest tests/test_services.py
