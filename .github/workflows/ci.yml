name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run db:local
      - run: npx wrangler deploy --dry-run --outdir .generated/worker
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AGENT_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - run: python -m pytest
      - run: node --check static/app.js
      - run: node --check static/settings.js
      - run: node --check static/calendar.js
  services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: daywork
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: daywork_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U daywork -d daywork_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports: ['6333:6333']
    env:
      RUN_SERVICE_TESTS: '1'
      AGENT_MODE: demo
      DATABASE_URL: postgresql+psycopg://daywork:ci_only@localhost:5432/daywork_test
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - run: python -m pytest tests/test_services.py
      - name: Build Zeabur Docker image
        run: docker build -t daywork-ci .
      - name: Smoke test production Demo container and platform port
        shell: bash
        run: |
          export ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          docker run -d --name daywork-ci --network host \
            -e DATABASE_URL -e QDRANT_URL -e ENCRYPTION_KEY \
            -e ENVIRONMENT=production -e PUBLIC_ORIGIN=https://demo.example.com \
            -e ALLOW_DEMO=true -e SEED_DEMO=true -e AGENT_MODE=demo \
            -e PORT=8099 daywork-ci
          trap 'docker logs daywork-ci; docker rm -f daywork-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent -H 'Host: demo.example.com' http://127.0.0.1:8099/api/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
